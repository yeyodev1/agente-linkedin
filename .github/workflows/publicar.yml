name: Publicar en LinkedIn

on:
  schedule:
    # El disparo principal lo hace el Worker de Cloudflare a las 8:30 en punto.
    # Este es el respaldo (10:00 am Ecuador) por si el Worker falla; el candado
    # del agente evita un segundo post el mismo día.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo redactar, sin publicar"
        type: boolean
        default: false
      forzar:
        description: "Publicar aunque ya haya un post hoy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-linkedin
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Redactar y publicar
        run: npm run publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_TOKEN_EXPIRA: ${{ secrets.LINKEDIN_TOKEN_EXPIRA }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORZAR: ${{ inputs.forzar && '1' || '0' }}

      - name: Guardar historial
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "agente-linkedin"
          git config user.email "agente-linkedin@users.noreply.github.com"
          git add contenido/historial.json
          git diff --cached --quiet || (git commit -m "post: $(date -u +%F)" && git push)
